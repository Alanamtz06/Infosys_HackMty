<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fondo: Warm paper white -->
  <rect width="400" height="400" rx="40" fill="#FAF6F3"/>
  
  <g transform="translate(200, 200)">
    <!-- Destello secundario diagonal: Dusty Pink -->
    <polygon points="0,-80 20,-20 80,0 20,20 0,80 -20,20 -80,0 -20,-20" fill="#E5CAD9" transform="rotate(45)"/>
    
    <!-- Destello principal afilado: Deep Plum -->
    <polygon points="0,-130 25,-25 130,0 25,25 0,130 -25,25 -130,0 -25,-25" fill="#684959"/>
    
    <!-- Centro/Nodo de conexión: Warm Taupe -->
    <circle cx="0" cy="0" r="15" fill="#D8CCCA"/>
  </g>
</svg>
